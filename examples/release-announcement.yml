name: Release announcement

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to announce
        required: true
      dry-run:
        description: Print the message in the job log instead of posting it
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest
    steps:
      - uses: DigitalGuards/.github/actions/release-discord@<commit-sha> # release-discord-v1
        with:
          project: Project Name
          webhook: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          tag: ${{ inputs.tag }}
          dry-run: ${{ inputs.dry-run }}
